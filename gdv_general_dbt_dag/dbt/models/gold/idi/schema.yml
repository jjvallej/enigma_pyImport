version: 2

models:
  - name: idi_processed_data
    description: |
      Vista IDI_PROCESSED_DATA en la capa gold que apunta directamente a la tabla consolidada de Silver (idi_transformed_data_consolidated).
      Contiene datos consolidados del Índice de Desarrollo e Innovación (IDI) para análisis final, uniendo información de los años 2023 y 2024
      con normalización de nombres de departamentos (eliminación de acentos y caracteres especiales).
      El IDI mide el desempeño institucional de las entidades públicas a través de 7 dimensiones principales y 19 políticas públicas,
      con más de 70 indicadores específicos. Esta vista proporciona acceso directo a todos los datos transformados y consolidados
      del IDI, incluyendo índices de dimensiones, políticas e indicadores individuales, así como información de clasificación
      de las entidades (código SIGEP, entidad, orden, clasificación orgánica, naturaleza jurídica, sector, departamento, municipio, etc.).
      Los valores numéricos han sido normalizados con COALESCE para convertir NULL a 0, facilitando los cálculos y análisis.
    columns:
      - name: anio
        description: Año del indicador IDI (2023 o 2024)
        data_type: INT64
      - name: territorio
        description: Nombre del territorio (departamento) normalizado en mayúsculas sin acentos ni caracteres especiales
        data_type: STRING
      - name: codigo_sigep
        description: Código SIGEP de la entidad (Sistema de Información para la Gestión Pública)
        data_type: STRING
      - name: entidad
        description: Nombre de la entidad pública evaluada
        data_type: STRING
      - name: orden
        description: Orden de la entidad en la clasificación
        data_type: STRING
      - name: clasificacion_organica
        description: Clasificación orgánica de la entidad
        data_type: STRING
      - name: naturaleza_juridica
        description: Naturaleza jurídica de la entidad
        data_type: STRING
      - name: sector
        description: Sector al que pertenece la entidad
        data_type: STRING
      - name: departamento
        description: Nombre del departamento donde opera la entidad
        data_type: STRING
      - name: municipio
        description: Nombre del municipio donde opera la entidad
        data_type: STRING
      - name: pdet
        description: Indicador si la entidad está en un territorio PDET (Programas de Desarrollo con Enfoque Territorial)
        data_type: STRING
      - name: capital
        description: Indicador si la entidad está en la capital del departamento
        data_type: INT64
      - name: id_grupo_par
        description: Identificador del grupo PAR (Plan Anticorrupción y de Atención al Ciudadano)
        data_type: INT64
      - name: grupo_par
        description: Nombre del grupo PAR
        data_type: STRING
      - name: tipo_formulario
        description: Tipo de formulario utilizado para la evaluación
        data_type: STRING
      - name: indice_de_desempeno_institucional
        description: Índice general de desempeño institucional (valor principal del IDI)
        data_type: FLOAT64
