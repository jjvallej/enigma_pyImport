  - name: ipm_sisben_processed_data
    description: |
      Vista FACT_SISBEN en la capa gold que contiene datos finales del SISBEN (Sistema de Identificación de Potenciales Beneficiarios de Programas Sociales).
      Este modelo selecciona columnas de descripción (texto) y valores numéricos de la capa silver para análisis final. Incluye información detallada sobre:
      vivienda y servicios públicos, gastos del hogar, eventos y desastres, características de las personas, discapacidades, salud, educación,
      trabajo y pensiones, ingresos, e indicadores de pobreza multidimensional (IPM). Esta vista está diseñada para análisis socioeconómicos
      y demográficos a nivel de hogar y persona.
    columns:
      - name: FICHA
        description: Número único de ficha SISBEN que identifica al hogar
        data_type: STRING
      - name: CODIGO_DEPARTAMENTO
        description: Código del departamento según DANE
        data_type: STRING
      - name: DEPARTAMENTO
        description: Nombre del departamento
        data_type: STRING
      - name: CODIGO_MUNICIPIO
        description: Código del municipio según DANE
        data_type: STRING
      - name: CODIGO_CLASE
        description: Código de clase del área (CABECERA, RURAL, etc.)
        data_type: STRING
      - name: GRUPO_SISBEN
        description: Grupo SISBEN asignado al hogar
        data_type: STRING
      - name: NIVEL_SISBEN
        description: Nivel SISBEN asignado al hogar
        data_type: STRING
      - name: TIPO_VIVIENDA
        description: Tipo de vivienda (Casa, Apartamento, Cuarto, etc.)
        data_type: STRING
      - name: MATERIAL_PAREDES
        description: Material de las paredes de la vivienda
        data_type: STRING
      - name: ELIMINACION_BASURA
        description: Método de eliminación de basura
        data_type: STRING
      - name: SERVICIO_ENERGIA
        description: Disponibilidad del servicio de energía eléctrica
        data_type: STRING
      - name: ESTRATO_ENERGIA
        description: Estrato del servicio de energía
        data_type: STRING
      - name: SERVICIO_ALCANTARILLADO
        description: Disponibilidad del servicio de alcantarillado
        data_type: STRING
      - name: SERVICIO_GAS
        description: Disponibilidad del servicio de gas
        data_type: STRING
      - name: SERVICIO_RECOLECCION_BASURA
        description: Disponibilidad del servicio de recolección de basura
        data_type: STRING
      - name: SERVICIO_ACUEDUCTO
        description: Disponibilidad del servicio de acueducto
        data_type: STRING
      - name: ESTRATO_ACUDUCTO
        description: Estrato del servicio de acueducto
        data_type: STRING
      - name: CANTIDAD_CUARTOS
        description: Cantidad de cuartos en la vivienda
        data_type: FLOAT64
      - name: CANTIDAD_HOGARES
        description: Cantidad de hogares en la vivienda
        data_type: FLOAT64
      - name: ID_HOGAR
        description: Identificador único del hogar
        data_type: FLOAT64
      - name: TIPO_OCUPACION_VIVIENDA
        description: Tipo de ocupación de la vivienda (Propia, Arrendada, etc.)
        data_type: STRING
      - name: ORIGEN_AGUA
        description: Origen del agua que consume el hogar
        data_type: STRING
      - name: AGUA_7_DIAS
        description: Disponibilidad de agua en los últimos 7 días
        data_type: STRING
      - name: DIAS_AGUA
        description: Cantidad de días con disponibilidad de agua
        data_type: FLOAT64
      - name: HORAS_AGUA
        description: Cantidad de horas con disponibilidad de agua
        data_type: FLOAT64
      - name: USO_AGUA_BEBER
        description: Uso del agua para beber
        data_type: STRING
      - name: GASTO_ALIMENTO
        description: Gasto mensual en alimentos (en pesos colombianos)
        data_type: FLOAT64
      - name: GASTO_TRANSPORTE
        description: Gasto mensual en transporte (en pesos colombianos)
        data_type: FLOAT64
      - name: GASTO_EDUCACION
        description: Gasto mensual en educación (en pesos colombianos)
