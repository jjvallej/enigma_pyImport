version: 2

models:
  - name: ipm_processed_data
    description: |
      Tabla FACT_DANE en la capa gold que contiene datos finales del Índice de Pobreza Multidimensional (IPM) por municipio.
      Este modelo consume la tabla final de silver (ipm_transform_clean) y presenta una estructura final con columnas en mayúsculas,
      sin porcentajes, sin sufijo _abs y sin fecha_lectura. Los datos representan la cantidad absoluta de personas en cada categoría
      de privación según los 15 indicadores del IPM. Esta tabla está diseñada para análisis y reportes finales del IPM a nivel municipal.
    columns:
      - name: cod_mpio
        description: Código único del municipio según DANE
        data_type: STRING
      - name: Municipio
        description: Nombre del municipio
        data_type: STRING
      - name: Total
        description: Total de población en el municipio
        data_type: FLOAT64
      - name: IPM_Pobre
        description: Cantidad absoluta de personas en condición de pobreza multidimensional
        data_type: FLOAT64
      - name: IPM_No_Pobre
        description: Cantidad absoluta de personas no pobres multidimensionalmente
        data_type: FLOAT64
      - name: I1_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I1 (Educación de los niños)
        data_type: FLOAT64
      - name: I1_SIN_PRIVACION
        description: Cantidad absoluta de personas sin privación en el indicador I1
        data_type: FLOAT64
      - name: I2_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I2 (Barreras de acceso a servicios de salud)
        data_type: FLOAT64
      - name: I2_SIN_PRIVACION
        description: Cantidad absoluta de personas sin privación en el indicador I2
        data_type: FLOAT64
      - name: I3_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I3 (Acceso al servicio de salud)
        data_type: FLOAT64
      - name: I3_SIN_PRIVACION
        description: Cantidad absoluta de personas sin privación en el indicador I3
        data_type: FLOAT64
      - name: I4_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I4 (Trabajo infantil)
        data_type: FLOAT64
      - name: I4_SIN_PRIVACION
        description: Cantidad absoluta de personas sin privación en el indicador I4
        data_type: FLOAT64
      - name: I5_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I5 (Asistencia escolar)
        data_type: FLOAT64
      - name: I5_SIN_PRIVACION
        description: Cantidad absoluta de personas sin privación en el indicador I5
        data_type: FLOAT64
      - name: I6_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I6 (Rezago escolar)
        data_type: FLOAT64
      - name: I6_SIN_PRIVACION
        description: Cantidad absoluta de personas sin privación en el indicador I6
        data_type: FLOAT64
      - name: I7_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I7 (Barreras de acceso a servicios para cuidado de la primera infancia)
        data_type: FLOAT64
      - name: I7_SIN_PRIVACION
        description: Cantidad absoluta de personas sin privación en el indicador I7
        data_type: FLOAT64
      - name: I8_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I8 (Trabajo informal)
        data_type: FLOAT64
      - name: I8_SIN_PRIVACION
        description: Cantidad absoluta de personas sin privación en el indicador I8
        data_type: FLOAT64
      - name: I9_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I9 (Desempleo de larga duración)
        data_type: FLOAT64
      - name: I9_SIN_PRIVACION
        description: Cantidad absoluta de personas sin privación en el indicador I9
        data_type: FLOAT64
      - name: I10_CON_PRIVACION
        description: Cantidad absoluta de personas con privación en el indicador I10 (Barreras de acceso a servicios de cuidado)
