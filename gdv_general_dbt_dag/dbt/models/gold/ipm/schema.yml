version: 2

models:
  - name: ipm_processed_data
    description: |
      Modelo gold que consume la tabla final de silver (ipm_transform_clean).
      Estructura final con columnas en mayúsculas, sin porcentajes, sin sufijo _abs y sin fecha_lectura.
      Contiene datos del Índice de Pobreza Multidimensional (IPM) por municipio.
    columns:
      - name: cod_mpio
        description: Código del municipio
        data_type: STRING
      - name: Municipio
        description: Nombre del municipio
        data_type: STRING
      - name: Total
        description: Total de población
        data_type: FLOAT64
      - name: IPM_Pobre
        description: Cantidad de personas en pobreza multidimensional
        data_type: FLOAT64
      - name: IPM_No_Pobre
        description: Cantidad de personas no pobres multidimensionalmente
