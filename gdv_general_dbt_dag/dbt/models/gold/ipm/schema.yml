  - name: ipm_sisben_processed_data
    description: |
      Vista gold que selecciona columnas de descripción (texto) y valores numéricos de la capa silver para análisis final.
      Contiene datos del SISBEN con información de vivienda, servicios, gastos, salud, educación, trabajo e ingresos.
    columns:
      - name: FICHA
        description: Número de ficha SISBEN
        data_type: STRING
      - name: CODIGO_DEPARTAMENTO
        description: Código del departamento
        data_type: STRING
      - name: DEPARTAMENTO
        description: Nombre del departamento
        data_type: STRING
      - name: CODIGO_MUNICIPIO
        description: Código del municipio
        data_type: STRING
      - name: CODIGO_CLASE
        description: Código de clase (CABECERA, RURAL, etc.)
        data_type: STRING
      - name: GRUPO_SISBEN
        description: Grupo SISBEN
        data_type: STRING
      - name: NIVEL_SISBEN
        description: Nivel SISBEN
        data_type: STRING
      - name: TIPO_VIVIENDA
        description: Tipo de vivienda
        data_type: STRING
      - name: MATERIAL_PAREDES
        description: Material de las paredes
        data_type: STRING
      - name: ELIMINACION_BASURA
        description: Método de eliminación de basura
        data_type: STRING
      - name: SERVICIO_ENERGIA
        description: Servicio de energía
        data_type: STRING
      - name: SERVICIO_ALCANTARILLADO
        description: Servicio de alcantarillado
        data_type: STRING
      - name: SERVICIO_GAS
        description: Servicio de gas
