version: 2
sources:
  - name: bronze_ipmv2
    description: Fuentes de datos raw del Índice de Pobreza Multidimensional (IPM) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: ipm_raw_data
        description: Datos raw del Índice de Pobreza Multidimensional por municipio
  - name: bronze_idc
    description: Fuentes de datos raw del Índice de Desarrollo Competitivo (IDC) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: idc_raw_data_dato_original
        description: Datos raw originales del IDC por departamento
      - name: idc_raw_data_valor_normalizado
        description: Datos raw con valores normalizados del IDC por departamento
      - name: idc_raw_data_valor_ranking
        description: Datos raw con valores de ranking del IDC por departamento
  - name: bronze_evaplan
    description: Fuentes de datos raw de la API de Evaplan en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: evaplan_api_periodos_raw_data
        description: Datos raw de periodos obtenidos de la API de Evaplan
      - name: evaplan_api_avance_mr_raw_data
        description: Datos raw de avance de Metas de Resultado (MR) obtenidos de la API de Evaplan
      - name: evaplan_api_avance_mp_raw_data
        description: Datos raw de avance de Metas de Producto (MP) obtenidos de la API de Evaplan
      - name: evaplan_api_avance_x_subprograma_raw_data
        description: Datos raw de avance por subprograma obtenidos de la API de Evaplan
      - name: evaplan_api_avance_general_raw_data
        description: Datos raw de avance general obtenidos de la API de Evaplan
      - name: evaplan_api_avance_subprogramas_raw_data
        description: Datos raw de avance de subprogramas obtenidos de la API de Evaplan
      - name: evaplan_api_avance_programas_raw_data
        description: Datos raw de avance de programas obtenidos de la API de Evaplan
      - name: evaplan_api_sector_mp_raw_data
        description: Datos raw del endpoint SectorMP obtenidos de la API de Evaplan
  - name: bronze_ipm_sisben
    description: Fuentes de datos raw del SISBEN en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: ipm_sisben_raw
        description: Datos raw del SISBEN con información de hogares y personas
  - name: bronze_idi
    description: Fuentes de datos raw del Índice de Desarrollo e Innovación (IDI) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: idi_raw_data_territorio_2023
        description: Datos raw del IDI por territorio para el año 2023
      - name: idi_raw_data_territorio_2024
        description: Datos raw del IDI por territorio para el año 2024
  - name: silver_evaplan
    description: Fuentes de datos transformados de Evaplan en la capa silver
    schema: "{{ var('silver_dataset') }}"
    tables:
      - name: evaplan_api_periodos_transformed_data
        description: Datos transformados de periodos de Evaplan
      - name: evaplan_api_avance_mr_transformed_data
        description: Datos transformados de avance de Metas de Resultado (MR) de Evaplan
      - name: evaplan_api_avance_mp_transformed_data
        description: Datos transformados de avance de Metas de Producto (MP) de Evaplan
      - name: evaplan_api_avance_x_subprograma_transformed_data
        description: Datos transformados de avance por subprograma de Evaplan
      - name: evaplan_api_avance_general_transformed_data
        description: Datos transformados de avance general de Evaplan
      - name: evaplan_api_avance_subprogramas_transformed_data
        description: Datos transformados de avance de subprogramas de Evaplan
      - name: evaplan_api_avance_programas_transformed_data
        description: Datos transformados de avance de programas de Evaplan
      - name: evaplan_api_sector_mp_transformed_data
        description: Datos transformados del endpoint SectorMP de Evaplan
  - name: silver_ipm_sisben
    description: "Fuentes de datos transformados del SISBEN en la capa silver. Contiene información detallada de hogares, personas, servicios públicos, condiciones de vivienda, gastos, salud, educación, ingresos e indicadores de pobreza multidimensional."
    schema: "{{ var('silver_dataset') }}"
    tables:
      - name: ipm_sisben_transformed_data
        description: "Tabla de staging que contiene los datos transformados del Sistema de Identificación de Potenciales Beneficiarios de Programas Sociales (SISBEN). Esta tabla agrega columnas de descripción legible para todos los códigos numéricos de la encuesta, facilitando el análisis y la interpretación de los datos. Incluye información completa sobre características de vivienda, servicios públicos, composición del hogar, condiciones de salud, nivel educativo, situación laboral, ingresos y gastos de las familias. Además, contiene los indicadores de pobreza multidimensional (IPM) calculados para cada persona, incluyendo el indicador general H5 y los 15 indicadores específicos (I1 a I15) que miden diferentes dimensiones de privación. Los datos están estructurados con la nomenclatura prefijada original de BigQuery, manteniendo las columnas originales junto con sus respectivas columnas de descripción en texto legible."
        columns:
          # 1. Columnas originales
          - name: _2_num_ficha
            description: "Número de ficha de la encuesta"
          - name: _3_cod_departamento
            description: "Código del departamento"
          - name: departamento
            description: "Nombre del departamento"
          - name: _4_cod_municipio
            description: "Código del municipio"
          - name: municipio
            description: "Nombre del municipio"

          # 2. Transformaciones con descripciones
          - name: _6_cod_clase
            description: "Código de la clase (1: Cabecera, 2: CP, 3: Rural)"
          - name: _6_cod_clase_DESCRIPCION
            description: "Descripción de la clase (CABECERA, CENTRO POBLADO, RURAL DISPERSO)"

          - name: _25_tipo_vivienda
            description: "Código tipo de vivienda"
          - name: _25_tipo_vivienda_DESCRIPCION
            description: "Descripción: CASA, APARTAMENTO, CUARTO, etc."

          - name: _26_tipo_material_paredes
            description: "Código material de paredes"
          - name: _26_tipo_material_paredes_DESCRIPCION
            description: "Descripción detallada del material de construcción de las paredes"

          - name: _28_energia
            description: "Disponibilidad de energía eléctrica"
          - name: _28_energia_DESCRIPCION
            description: "SI / NO / OTRO"

          - name: _29_estrato_energia
            description: "Estrato de energía"
