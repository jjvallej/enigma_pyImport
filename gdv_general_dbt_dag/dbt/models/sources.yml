      - name: idc_raw_data_dato_original
        description: |
          "Tabla que contiene datos raw (sin transformar) originales del Índice de Desarrollo y Competitividad (IDC) por departamento. 
          Estos datos representan los valores originales tal como se obtienen de la fuente, antes de cualquier normalización o transformación. 
          Incluye todos los indicadores IDC organizados por categorías: Insuficiencia de Condiciones de Vida (INS), Insuficiencia de Funcionamiento (INF), 
          Tecnologías de la Información y Comunicación (TIC), Ambiente (AMB), Salud (SAL), Educación (EDU), Edificaciones y Servicios (EDS), 
          Negocios (NEG), Laboral (LAB), Financiero (FIN), Tamaño (TAM), Software (SOF) e Innovación (INN)."
        columns:
          - name: Fila
            description: "Identificador de fila o número de registro. Campo auxiliar para identificar cada registro en la tabla."
            data_type: STRING
          - name: Departamento
            description: "Nombre del departamento. Contiene el nombre original del departamento tal como aparece en la fuente de datos."
            data_type: STRING
          - name: Año_IDC
            description: "Año del indicador IDC. Indica el año calendario al que corresponden los datos del IDC."
