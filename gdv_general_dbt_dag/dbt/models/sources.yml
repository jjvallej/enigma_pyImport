            data_type: STRING
          - name: cantidad_np
            description: "Cantidad de No Programadas (NP). Indica el número de metas o actividades que no fueron programadas en el periodo de seguimiento."
            data_type: STRING
          - name: fimr_programa
            description: "Identificador de la Meta de Resultado (MR) asociada al programa. Relaciona el programa con su meta de resultado correspondiente."
            data_type: STRING
          - name: cantidad_validos
            description: "Cantidad de registros válidos. Indica el número de metas o registros que son considerados válidos para el cálculo de avance del subprograma."
            data_type: STRING
          - name: fimr_subprograma
            description: "Identificador de la Meta de Resultado (MR) asociada al subprograma. Relaciona el subprograma con su meta de resultado correspondiente."
            data_type: STRING
          - name: avanceponderadosub
            description: "Avance ponderado del subprograma. Calcula el avance del subprograma considerando la ponderación de sus componentes y metas de producto."
            data_type: STRING
          - name: prom_avance_sub_mp
            description: "Promedio de avance de subprograma por Meta de Producto (MP). Representa el promedio de avance de las metas de producto dentro del subprograma."
            data_type: STRING
          - name: ponderacionsubprograma
            description: "Ponderación del subprograma. Representa el peso o importancia relativa del subprograma dentro del programa o meta de resultado."
            data_type: STRING
          - name: peri_idp
            description: "Identificador único del periodo de seguimiento. Es un número entero que identifica de manera única cada periodo de reporte en el sistema Evaplan."
            data_type: INT64
          - name: fecha_lectura
            description: "Fecha y hora en que se realizó la lectura de los datos desde la API de Evaplan. Esta fecha se agrega automáticamente durante el proceso de carga para rastrear cuándo se obtuvieron los datos."
            data_type: TIMESTAMP
      - name: evaplan_api_avance_programas_transformed_data
        description: |
          "Tabla que contiene información detallada del avance de los programas por periodo de seguimiento. 
          Los programas son conjuntos de actividades y metas organizadas para alcanzar objetivos específicos. 
          Incluye métricas de avance, indicadores de cumplimiento, información sobre recursos asignados y ejecutados, 
          y otros datos relevantes para el seguimiento y evaluación del desempeño de cada programa."
        columns:
          - name: fila
            description: "Identificador de fila o número de registro. Campo auxiliar para identificar cada registro en la tabla."
            data_type: STRING
          - name: linea_estrategica
            description: "Línea estratégica asociada al programa. Identifica la línea estratégica a la que pertenece el programa y sus metas."
            data_type: STRING
          - name: detalle_programas_json
            description: "Detalle de programas en formato JSON. Contiene información estructurada sobre los programas, incluyendo subprogramas, metas de producto, cumplimientos, y otras métricas relacionadas con cada programa."
            data_type: STRING
          - name: pg_suma_cumpl_linea_estrategica
            description: "Suma de cumplimiento de la línea estratégica según Plan de Gestión (PG). Agrega el cumplimiento de todos los programas asociados a la línea estratégica considerando el plan de gestión."
            data_type: STRING
          - name: pa_promedio_cumpl_linea_estrategica
            description: "Promedio de cumplimiento de la línea estratégica según Plan de Acción (PA). Calcula el promedio de cumplimiento de todos los programas asociados a la línea estratégica considerando el plan de acción."
            data_type: STRING
          - name: peri_idp
            description: "Identificador único del periodo de seguimiento. Es un número entero que identifica de manera única cada periodo de reporte en el sistema Evaplan."
            data_type: INT64
          - name: fecha_lectura
            description: "Fecha y hora en que se realizó la lectura de los datos desde la API de Evaplan. Esta fecha se agrega automáticamente durante el proceso de carga para rastrear cuándo se obtuvieron los datos."
            data_type: TIMESTAMP
      - name: evaplan_api_sector_mp_transformed_data
        description: |
          "Tabla que contiene el avance de las Metas de Producto (MP) desagregado por sector para cada periodo de seguimiento. 
          Los sectores representan áreas temáticas o categorías de intervención (por ejemplo, salud, educación, infraestructura). 
          Incluye información sobre la cantidad de metas de producto por sector, rangos de avance (mayores o iguales a 80%, entre 25% y 80%, menores a 25%), 
          porcentajes de cumplimiento por sector, y calificaciones de desempeño. Esta desagregación permite análisis sectoriales del avance de las metas."
        columns:
          - name: fila
            description: "Identificador de fila o número de registro. Campo auxiliar para identificar cada registro en la tabla."
            data_type: STRING
          - name: cant_mp
            description: "Cantidad de Metas de Producto (MP). Representa el número total de metas de producto en el sector para el periodo de seguimiento."
            data_type: STRING
          - name: menores_25
            description: "Cantidad de Metas de Producto con avance menor al 25%. Indica el número de metas que tienen un avance inferior al 25% en el sector."
            data_type: STRING
          - name: sector_mga
            description: "Código del sector según clasificación MGA (Marco General de Actuación). Identifica el sector al que pertenecen las metas de producto."
            data_type: STRING
          - name: sector_sap
            description: "Código del sector según clasificación SAP. Identifica el sector al que pertenecen las metas de producto según el sistema SAP."
            data_type: STRING
          - name: cantidad_np
            description: "Cantidad de No Programadas (NP). Indica el número de metas de producto que no fueron programadas en el sector para el periodo de seguimiento."
            data_type: STRING
          - name: calificacion_mp
            description: "Calificación de la Meta de Producto. Representa una calificación o evaluación del desempeño de las metas de producto en el sector."
            data_type: STRING
          - name: nombre_sector_sap
            description: "Nombre del sector según clasificación SAP. Contiene el nombre descriptivo del sector al que pertenecen las metas de producto."
            data_type: STRING
          - name: mayores_iguales_80
            description: "Cantidad de Metas de Producto con avance mayor o igual al 80%. Indica el número de metas que tienen un avance igual o superior al 80% en el sector."
            data_type: STRING
          - name: cantidad_programadas
            description: "Cantidad de Metas Programadas. Indica el número total de metas de producto que fueron programadas en el sector para el periodo de seguimiento."
            data_type: STRING
          - name: menores_80_mayores_25
            description: "Cantidad de Metas de Producto con avance entre 25% y 80%. Indica el número de metas que tienen un avance entre el 25% y el 80% (sin incluir 80%) en el sector."
            data_type: STRING
          - name: peri_idp
            description: "Identificador único del periodo de seguimiento. Es un número entero que identifica de manera única cada periodo de reporte en el sistema Evaplan."
            data_type: INT64
          - name: fecha_lectura
            description: "Fecha y hora en que se realizó la lectura de los datos desde la API de Evaplan. Esta fecha se agrega automáticamente durante el proceso de carga para rastrear cuándo se obtuvieron los datos."
            data_type: TIMESTAMP
  - name: silver_ipm_sisben
    description: "Fuentes de datos transformados del SISBEN en la capa silver. Contiene información detallada de hogares, personas, servicios públicos, condiciones de vivienda, gastos, salud, educación, ingresos e indicadores de pobreza multidimensional."
    schema: "{{ var('silver_dataset') }}"
    tables:
      - name: ipm_sisben_transformed_data
        description: "Tabla de staging que contiene los datos transformados del Sistema de Identificación de Potenciales Beneficiarios de Programas Sociales (SISBEN). Esta tabla agrega columnas de descripción legible para todos los códigos numéricos de la encuesta, facilitando el análisis y la interpretación de los datos. Incluye información completa sobre características de vivienda, servicios públicos, composición del hogar, condiciones de salud, nivel educativo, situación laboral, ingresos y gastos de las familias. Además, contiene los indicadores de pobreza multidimensional (IPM) calculados para cada persona, incluyendo el indicador general H5 y los 15 indicadores específicos (I1 a I15) que miden diferentes dimensiones de privación. Los datos están estructurados con la nomenclatura prefijada original de BigQuery, manteniendo las columnas originales junto con sus respectivas columnas de descripción en texto legible."
