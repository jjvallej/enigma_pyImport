version: 2
sources:
  - name: bronze_ipmv2
    description: Fuentes de datos raw del Índice de Pobreza Multidimensional (IPM) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: ipm_raw_data
        description: Datos raw del Índice de Pobreza Multidimensional por municipio
  - name: bronze_idc
    description: Fuentes de datos raw del Índice de Desarrollo Competitivo (IDC) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: idc_raw_data_dato_original
        description: Datos raw originales del IDC por departamento
      - name: idc_raw_data_valor_normalizado
        description: Datos raw con valores normalizados del IDC por departamento
      - name: idc_raw_data_valor_ranking
        description: Datos raw con valores de ranking del IDC por departamento
  - name: bronze_evaplan
    description: Fuentes de datos raw de la API de Evaplan en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: evaplan_api_periodos_raw_data
        description: Datos raw de periodos obtenidos de la API de Evaplan
      - name: evaplan_api_avance_mr_raw_data
        description: Datos raw de avance de Metas de Resultado (MR) obtenidos de la API de Evaplan
      - name: evaplan_api_avance_mp_raw_data
        description: Datos raw de avance de Metas de Producto (MP) obtenidos de la API de Evaplan
      - name: evaplan_api_avance_x_subprograma_raw_data
        description: Datos raw de avance por subprograma obtenidos de la API de Evaplan
      - name: evaplan_api_avance_general_raw_data
        description: Datos raw de avance general obtenidos de la API de Evaplan
      - name: evaplan_api_avance_subprogramas_raw_data
        description: Datos raw de avance de subprogramas obtenidos de la API de Evaplan
      - name: evaplan_api_avance_programas_raw_data
        description: Datos raw de avance de programas obtenidos de la API de Evaplan
      - name: evaplan_api_sector_mp_raw_data
        description: Datos raw del endpoint SectorMP obtenidos de la API de Evaplan
  - name: bronze_ipm_sisben
    description: Fuentes de datos raw del SISBEN en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: ipm_sisben_raw
        description: Datos raw del SISBEN con información de hogares y personas
  - name: bronze_idi
    description: Fuentes de datos raw del Índice de Desarrollo e Innovación (IDI) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: idi_raw_data_territorio_2023
        description: Datos raw del IDI por territorio para el año 2023
      - name: idi_raw_data_territorio_2024
        description: Datos raw del IDI por territorio para el año 2024
  - name: silver_evaplan
    description: |
      "Fuentes de datos transformados de Evaplan en la capa silver. 
      Estas tablas contienen datos procesados y normalizados desde la capa bronze, con nombres de columnas convertidos a snake_case, 
      valores NULL reemplazados por 0 (numéricos) o '0' (strings), y datos organizados por periodo de seguimiento (peri_idp). 
      Los datos se actualizan mediante el proceso de transformación que elimina registros antiguos del mismo periodo y carga los más recientes, 
      asegurando que silver mantenga solo la información más actualizada mientras bronze conserva el histórico completo."
    schema: "{{ var('silver_dataset') }}"
    tables:
      - name: evaplan_api_periodos_transformed_data
        description: |
          "Tabla que contiene información de los periodos de seguimiento disponibles en el sistema Evaplan. 
          Incluye detalles como identificador del periodo (peri_idp), nombre del periodo, fechas de apertura y cierre, 
          año de seguimiento, y otros metadatos relacionados con los periodos de reporte. 
          Esta tabla es fundamental para relacionar los datos de avance con sus respectivos periodos de medición."
        columns:
          - name: peri_idp
            description: "Identificador único del periodo de seguimiento. Es un número entero que identifica de manera única cada periodo de reporte en el sistema Evaplan."
            data_type: INT64
          - name: peri_nombre
            description: "Nombre descriptivo del periodo de seguimiento. Generalmente contiene información sobre el año y tipo de periodo (ej: '2024 - Primer Semestre')."
            data_type: STRING
          - name: fecha_cierre
            description: "Fecha de cierre del periodo de seguimiento. Indica la fecha límite para el reporte de avances en este periodo."
            data_type: STRING
          - name: fecha_apertura
            description: "Fecha de apertura del periodo de seguimiento. Indica la fecha en que se inicia el periodo de reporte."
            data_type: STRING
          - name: peri_datosapis
            description: "Campo que contiene información adicional sobre el periodo relacionada con las APIs de datos. Puede incluir metadatos o configuraciones específicas del periodo."
            data_type: STRING
          - name: ano_seguimiento
            description: "Año de seguimiento correspondiente al periodo. Indica el año calendario al que pertenece el periodo de reporte."
            data_type: STRING
          - name: peri_idperiodogobiernoactivo
            description: "Identificador del periodo de gobierno activo asociado al periodo de seguimiento. Relaciona el periodo con el período de gobierno correspondiente."
            data_type: STRING
          - name: fecha_lectura
            description: "Fecha y hora en que se realizó la lectura de los datos desde la API de Evaplan. Esta fecha se agrega automáticamente durante el proceso de carga para rastrear cuándo se obtuvieron los datos."
            data_type: TIMESTAMP
      - name: evaplan_api_avance_mr_transformed_data
        description: |
          "Tabla que contiene el avance de las Metas de Resultado (MR) por periodo de seguimiento. 
          Las Metas de Resultado representan los objetivos estratégicos de alto nivel que se miden en el sistema de planeación. 
          Incluye información sobre el estado de avance, porcentajes de cumplimiento, y métricas asociadas a cada meta de resultado 
          para los diferentes periodos de seguimiento configurados en Evaplan."
        columns:
          - name: fila
            description: "Identificador de fila o número de registro. Campo auxiliar para identificar cada registro en la tabla."
            data_type: STRING
          - name: codigo_mr
            description: "Código único identificador de la Meta de Resultado (MR). Identifica de manera única cada meta de resultado en el sistema."
            data_type: STRING
          - name: nombre_mr
            description: "Nombre descriptivo de la Meta de Resultado (MR). Contiene la descripción completa de la meta de resultado."
            data_type: STRING
          - name: linea_base
            description: "Línea base de la Meta de Resultado. Representa el valor inicial o punto de partida desde el cual se mide el avance de la meta."
            data_type: STRING
          - name: codigo_linea
            description: "Código de la línea estratégica asociada a la Meta de Resultado. Relaciona la meta con su línea estratégica correspondiente."
            data_type: STRING
          - name: codigo_entidad
            description: "Código identificador de la entidad responsable de la Meta de Resultado. Identifica la entidad que tiene a cargo el cumplimiento de la meta."
            data_type: STRING
          - name: nombre_entidad
            description: "Nombre de la entidad responsable de la Meta de Resultado. Contiene el nombre completo de la entidad encargada del cumplimiento."
            data_type: STRING
          - name: codigo_programa
            description: "Código identificador del programa asociado a la Meta de Resultado. Relaciona la meta con su programa correspondiente."
            data_type: STRING
          - name: valor_ajustado_1
            description: "Valor ajustado del periodo 1. Representa el valor ajustado o corregido de la meta para el primer periodo de seguimiento."
            data_type: STRING
          - name: valor_ajustado_2
            description: "Valor ajustado del periodo 2. Representa el valor ajustado o corregido de la meta para el segundo periodo de seguimiento."
            data_type: STRING
          - name: valor_ajustado_3
            description: "Valor ajustado del periodo 3. Representa el valor ajustado o corregido de la meta para el tercer periodo de seguimiento."
            data_type: STRING
          - name: valor_ajustado_4
            description: "Valor ajustado del periodo 4. Representa el valor ajustado o corregido de la meta para el cuarto periodo de seguimiento."
            data_type: STRING
          - name: valor_esperado_1
            description: "Valor esperado del periodo 1. Indica el valor que se esperaba alcanzar en el primer periodo de seguimiento según la programación."
            data_type: STRING
          - name: valor_esperado_2
            description: "Valor esperado del periodo 2. Indica el valor que se esperaba alcanzar en el segundo periodo de seguimiento según la programación."
            data_type: STRING
          - name: valor_esperado_3
            description: "Valor esperado del periodo 3. Indica el valor que se esperaba alcanzar en el tercer periodo de seguimiento según la programación."
            data_type: STRING
          - name: valor_esperado_4
            description: "Valor esperado del periodo 4. Indica el valor que se esperaba alcanzar en el cuarto periodo de seguimiento según la programación."
            data_type: STRING
          - name: porcentaje_avance
            description: "Porcentaje de avance general de la Meta de Resultado. Representa el porcentaje de cumplimiento alcanzado hasta la fecha."
            data_type: STRING
          - name: valor_alcanzado_1
            description: "Valor alcanzado en el periodo 1. Indica el valor real logrado en el primer periodo de seguimiento."
            data_type: STRING
          - name: valor_alcanzado_2
            description: "Valor alcanzado en el periodo 2. Indica el valor real logrado en el segundo periodo de seguimiento."
            data_type: STRING
          - name: valor_alcanzado_3
            description: "Valor alcanzado en el periodo 3. Indica el valor real logrado en el tercer periodo de seguimiento."
            data_type: STRING
          - name: valor_alcanzado_4
            description: "Valor alcanzado en el periodo 4. Indica el valor real logrado en el cuarto periodo de seguimiento."
            data_type: STRING
          - name: codigo_comportamiento
            description: "Código del comportamiento asociado a la Meta de Resultado. Identifica el tipo de comportamiento o tendencia de la meta."
            data_type: STRING
          - name: nombre_comportamiento
            description: "Nombre del comportamiento asociado a la Meta de Resultado. Describe el tipo de comportamiento o tendencia de la meta."
            data_type: STRING
          - name: porcentaje_avance_pa1
            description: "Porcentaje de avance del Plan de Acción (PA) periodo 1. Indica el porcentaje de cumplimiento del plan de acción en el primer periodo."
            data_type: STRING
          - name: porcentaje_avance_pa2
            description: "Porcentaje de avance del Plan de Acción (PA) periodo 2. Indica el porcentaje de cumplimiento del plan de acción en el segundo periodo."
            data_type: STRING
          - name: porcentaje_avance_pa3
            description: "Porcentaje de avance del Plan de Acción (PA) periodo 3. Indica el porcentaje de cumplimiento del plan de acción en el tercer periodo."
            data_type: STRING
          - name: porcentaje_avance_pa4
            description: "Porcentaje de avance del Plan de Acción (PA) periodo 4. Indica el porcentaje de cumplimiento del plan de acción en el cuarto periodo."
            data_type: STRING
          - name: porcentaje_avance_pg1
            description: "Porcentaje de avance del Plan de Gestión (PG) periodo 1. Indica el porcentaje de cumplimiento del plan de gestión en el primer periodo."
            data_type: STRING
          - name: porcentaje_avance_pg2
            description: "Porcentaje de avance del Plan de Gestión (PG) periodo 2. Indica el porcentaje de cumplimiento del plan de gestión en el segundo periodo."
            data_type: STRING
          - name: porcentaje_avance_pg3
            description: "Porcentaje de avance del Plan de Gestión (PG) periodo 3. Indica el porcentaje de cumplimiento del plan de gestión en el tercer periodo."
            data_type: STRING
          - name: porcentaje_avance_pg4
            description: "Porcentaje de avance del Plan de Gestión (PG) periodo 4. Indica el porcentaje de cumplimiento del plan de gestión en el cuarto periodo."
            data_type: STRING
          - name: porcentaje_avance_ponderado
            description: "Porcentaje de avance ponderado de la Meta de Resultado. Calcula el avance considerando la ponderación de los diferentes componentes o periodos."
            data_type: STRING
          - name: valor_ajustado_cuatrienario
            description: "Valor ajustado cuatrienario. Representa el valor ajustado o corregido de la meta para todo el periodo cuatrienario."
            data_type: STRING
          - name: valor_esperado_cuatrienario
            description: "Valor esperado cuatrienario. Indica el valor que se esperaba alcanzar en todo el periodo cuatrienario según la programación."
            data_type: STRING
          - name: valor_alcanzado_cuatrienario
            description: "Valor alcanzado cuatrienario. Indica el valor real logrado en todo el periodo cuatrienario."
            data_type: STRING
          - name: porcentaje_avance_cuatrienario
            description: "Porcentaje de avance cuatrienario. Representa el porcentaje de cumplimiento alcanzado en todo el periodo cuatrienario."
            data_type: STRING
          - name: peri_idp
            description: "Identificador único del periodo de seguimiento. Es un número entero que identifica de manera única cada periodo de reporte en el sistema Evaplan."
            data_type: INT64
          - name: fecha_lectura
            description: "Fecha y hora en que se realizó la lectura de los datos desde la API de Evaplan. Esta fecha se agrega automáticamente durante el proceso de carga para rastrear cuándo se obtuvieron los datos."
            data_type: TIMESTAMP
      - name: evaplan_api_avance_mp_transformed_data
        description: |
          "Tabla que contiene el avance de las Metas de Producto (MP) por periodo de seguimiento. 
          Las Metas de Producto representan los productos o entregables específicos que contribuyen al cumplimiento de las Metas de Resultado. 
          Incluye información detallada sobre el estado de avance, cantidades programadas vs ejecutadas, porcentajes de cumplimiento, 
          y métricas de seguimiento para cada meta de producto en los diferentes periodos."
        columns:
          - name: fila
            description: "Identificador de fila o número de registro. Campo auxiliar para identificar cada registro en la tabla."
            data_type: STRING
          - name: periodo
            description: "Periodo de seguimiento al que pertenece el registro. Identifica el periodo específico de reporte."
            data_type: STRING
          - name: eficacia
            description: "Indicador de eficacia de la Meta de Producto. Mide el grado en que se logran los resultados esperados."
            data_type: STRING
          - name: codigo_mp
            description: "Código único identificador de la Meta de Producto (MP). Identifica de manera única cada meta de producto en el sistema."
            data_type: STRING
          - name: indicador
            description: "Indicador asociado a la Meta de Producto. Describe la métrica o medida utilizada para evaluar el cumplimiento de la meta."
            data_type: STRING
          - name: nombre_mp
            description: "Nombre descriptivo de la Meta de Producto (MP). Contiene la descripción completa de la meta de producto."
            data_type: STRING
          - name: eficiencia
            description: "Indicador de eficiencia de la Meta de Producto. Mide la relación entre los recursos utilizados y los resultados obtenidos."
            data_type: STRING
          - name: linea_base
            description: "Línea base de la Meta de Producto. Representa el valor inicial o punto de partida desde el cual se mide el avance de la meta."
            data_type: STRING
          - name: sector_mga
            description: "Código del sector según clasificación MGA (Marco General de Actuación). Identifica el sector al que pertenece la meta."
            data_type: STRING
          - name: sector_sap
            description: "Código del sector según clasificación SAP. Identifica el sector al que pertenece la meta según el sistema SAP."
            data_type: STRING
          - name: efectividad
            description: "Indicador de efectividad de la Meta de Producto. Mide el impacto y la relevancia de los resultados obtenidos."
            data_type: STRING
          - name: codigo_linea
            description: "Código de la línea estratégica asociada a la Meta de Producto. Relaciona la meta con su línea estratégica correspondiente."
            data_type: STRING
          - name: ponderado_mp
            description: "Valor ponderado de la Meta de Producto. Representa el peso o importancia relativa de la meta dentro de su contexto."
            data_type: STRING
          - name: tipo_de_meta
            description: "Tipo de meta de la Meta de Producto. Clasifica la meta según su naturaleza o categoría."
            data_type: STRING
          - name: codigo_entidad
            description: "Código identificador de la entidad responsable de la Meta de Producto. Identifica la entidad que tiene a cargo el cumplimiento de la meta."
            data_type: STRING
          - name: fecha_creacion
            description: "Fecha de creación de la Meta de Producto. Indica cuándo fue creada o registrada la meta en el sistema."
            data_type: STRING
          - name: nombre_entidad
            description: "Nombre de la entidad responsable de la Meta de Producto. Contiene el nombre completo de la entidad encargada del cumplimiento."
            data_type: STRING
          - name: codigo_programa
            description: "Código identificador del programa asociado a la Meta de Producto. Relaciona la meta con su programa correspondiente."
            data_type: STRING
          - name: meta_mr_asociada
            description: "Identificador de la Meta de Resultado (MR) asociada a la Meta de Producto. Relaciona la meta de producto con su meta de resultado correspondiente."
            data_type: STRING
          - name: valor_esperado_1
            description: "Valor esperado del periodo 1. Indica el valor que se esperaba alcanzar en el primer periodo de seguimiento según la programación."
            data_type: STRING
          - name: valor_esperado_2
            description: "Valor esperado del periodo 2. Indica el valor que se esperaba alcanzar en el segundo periodo de seguimiento según la programación."
            data_type: STRING
          - name: valor_esperado_3
            description: "Valor esperado del periodo 3. Indica el valor que se esperaba alcanzar en el tercer periodo de seguimiento según la programación."
            data_type: STRING
          - name: valor_esperado_4
            description: "Valor esperado del periodo 4. Indica el valor que se esperaba alcanzar en el cuarto periodo de seguimiento según la programación."
            data_type: STRING
          - name: nombre_sector_sap
            description: "Nombre del sector según clasificación SAP. Contiene el nombre descriptivo del sector al que pertenece la meta."
            data_type: STRING
          - name: valor_alcanzado_1
            description: "Valor alcanzado en el periodo 1. Indica el valor real logrado en el primer periodo de seguimiento."
            data_type: STRING
          - name: valor_alcanzado_2
            description: "Valor alcanzado en el periodo 2. Indica el valor real logrado en el segundo periodo de seguimiento."
            data_type: STRING
          - name: valor_alcanzado_3
            description: "Valor alcanzado en el periodo 3. Indica el valor real logrado en el tercer periodo de seguimiento."
            data_type: STRING
          - name: valor_alcanzado_4
            description: "Valor alcanzado en el periodo 4. Indica el valor real logrado en el cuarto periodo de seguimiento."
            data_type: STRING
          - name: valor_reprogramado_1
            description: "Valor reprogramado del periodo 1. Representa el valor ajustado o reprogramado de la meta para el primer periodo de seguimiento."
            data_type: STRING
          - name: valor_reprogramado_2
            description: "Valor reprogramado del periodo 2. Representa el valor ajustado o reprogramado de la meta para el segundo periodo de seguimiento."
            data_type: STRING
          - name: valor_reprogramado_3
            description: "Valor reprogramado del periodo 3. Representa el valor ajustado o reprogramado de la meta para el tercer periodo de seguimiento."
            data_type: STRING
          - name: valor_reprogramado_4
            description: "Valor reprogramado del periodo 4. Representa el valor ajustado o reprogramado de la meta para el cuarto periodo de seguimiento."
            data_type: STRING
          - name: codigo_comportamiento
            description: "Código del comportamiento asociado a la Meta de Producto. Identifica el tipo de comportamiento o tendencia de la meta."
            data_type: STRING
          - name: nombre_comportamiento
            description: "Nombre del comportamiento asociado a la Meta de Producto. Describe el tipo de comportamiento o tendencia de la meta."
            data_type: STRING
          - name: avance_ponderado_mp_pa
            description: "Avance ponderado de la Meta de Producto según Plan de Acción (PA). Calcula el avance considerando la ponderación del plan de acción."
            data_type: STRING
          - name: avance_ponderado_mp_pg
            description: "Avance ponderado de la Meta de Producto según Plan de Gestión (PG). Calcula el avance considerando la ponderación del plan de gestión."
            data_type: STRING
          - name: porcentaje_avance_pa_1
            description: "Porcentaje de avance del Plan de Acción (PA) periodo 1. Indica el porcentaje de cumplimiento del plan de acción en el primer periodo."
            data_type: STRING
          - name: porcentaje_avance_pa_2
            description: "Porcentaje de avance del Plan de Acción (PA) periodo 2. Indica el porcentaje de cumplimiento del plan de acción en el segundo periodo."
            data_type: STRING
          - name: porcentaje_avance_pa_3
            description: "Porcentaje de avance del Plan de Acción (PA) periodo 3. Indica el porcentaje de cumplimiento del plan de acción en el tercer periodo."
            data_type: STRING
          - name: porcentaje_avance_pa_4
            description: "Porcentaje de avance del Plan de Acción (PA) periodo 4. Indica el porcentaje de cumplimiento del plan de acción en el cuarto periodo."
            data_type: STRING
          - name: porcentaje_avance_pg_1
            description: "Porcentaje de avance del Plan de Gestión (PG) periodo 1. Indica el porcentaje de cumplimiento del plan de gestión en el primer periodo."
            data_type: STRING
          - name: porcentaje_avance_pg_2
            description: "Porcentaje de avance del Plan de Gestión (PG) periodo 2. Indica el porcentaje de cumplimiento del plan de gestión en el segundo periodo."
            data_type: STRING
          - name: porcentaje_avance_pg_3
            description: "Porcentaje de avance del Plan de Gestión (PG) periodo 3. Indica el porcentaje de cumplimiento del plan de gestión en el tercer periodo."
            data_type: STRING
          - name: porcentaje_avance_pg_4
            description: "Porcentaje de avance del Plan de Gestión (PG) periodo 4. Indica el porcentaje de cumplimiento del plan de gestión en el cuarto periodo."
            data_type: STRING
          - name: porcentaje_avance_mp_pa
            description: "Porcentaje de avance de la Meta de Producto según Plan de Acción (PA). Representa el porcentaje de cumplimiento de la meta considerando el plan de acción."
            data_type: STRING
          - name: porcentaje_avance_mp_pg
            description: "Porcentaje de avance de la Meta de Producto según Plan de Gestión (PG). Representa el porcentaje de cumplimiento de la meta considerando el plan de gestión."
            data_type: STRING
          - name: valor_alcanzado_cuatrienio
            description: "Valor alcanzado cuatrienio. Indica el valor real logrado en todo el periodo cuatrienario."
            data_type: STRING
          - name: valor_cuatrienario_esperado
            description: "Valor esperado cuatrienario. Indica el valor que se esperaba alcanzar en todo el periodo cuatrienario según la programación."
            data_type: STRING
          - name: valor_reprogramado_cuatriario
            description: "Valor reprogramado cuatrienario. Representa el valor ajustado o reprogramado de la meta para todo el periodo cuatrienario."
            data_type: STRING
          - name: porcentaje_avance_cuatrienio_pg
            description: "Porcentaje de avance cuatrienio según Plan de Gestión (PG). Representa el porcentaje de cumplimiento alcanzado en todo el periodo cuatrienario considerando el plan de gestión."
            data_type: STRING
          - name: verificacion_del_avance_esperado
            description: "Verificación del avance esperado. Campo que indica el estado de verificación o validación del avance esperado de la meta."
            data_type: STRING
          - name: valor_esperado_ajustado_cumplimiento
            description: "Valor esperado ajustado para cumplimiento. Representa el valor esperado que ha sido ajustado para reflejar el cumplimiento real de la meta."
            data_type: STRING
          - name: peri_idp
            description: "Identificador único del periodo de seguimiento. Es un número entero que identifica de manera única cada periodo de reporte en el sistema Evaplan."
            data_type: INT64
          - name: fecha_lectura
            description: "Fecha y hora en que se realizó la lectura de los datos desde la API de Evaplan. Esta fecha se agrega automáticamente durante el proceso de carga para rastrear cuándo se obtuvieron los datos."
            data_type: TIMESTAMP
      - name: evaplan_api_avance_x_subprograma_transformed_data
        description: |
          "Tabla que contiene el avance agregado por subprograma para cada periodo de seguimiento. 
          Los subprogramas son unidades organizacionales que agrupan múltiples programas y metas. 
          Esta tabla proporciona una vista consolidada del avance de todos los programas y metas asociados a cada subprograma, 
          permitiendo análisis de cumplimiento a nivel de estructura organizacional intermedia."
        columns:
          - name: fila
            description: "Identificador de fila o número de registro. Campo auxiliar para identificar cada registro en la tabla."
            data_type: STRING
          - name: mpxsubp
