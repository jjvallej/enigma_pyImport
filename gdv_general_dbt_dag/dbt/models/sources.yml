version: 2
sources:
  - name: bronze_ipmv2
    description: Fuentes de datos raw del Índice de Pobreza Multidimensional (IPM) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: ipm_raw_data
        description: Datos raw del Índice de Pobreza Multidimensional por municipio
  - name: bronze_idc
    description: Fuentes de datos raw del Índice de Desarrollo Competitivo (IDC) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: idc_raw_data_dato_original
        description: Datos raw originales del IDC por departamento
      - name: idc_raw_data_valor_normalizado
        description: Datos raw con valores normalizados del IDC por departamento
      - name: idc_raw_data_valor_ranking
        description: Datos raw con valores de ranking del IDC por departamento
  - name: bronze_evaplan
    description: Fuentes de datos raw de la API de Evaplan en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: evaplan_api_periodos_raw_data
        description: Datos raw de periodos obtenidos de la API de Evaplan
      - name: evaplan_api_avance_mr_raw_data
        description: Datos raw de avance de Metas de Resultado (MR) obtenidos de la API de Evaplan
      - name: evaplan_api_avance_mp_raw_data
        description: Datos raw de avance de Metas de Producto (MP) obtenidos de la API de Evaplan
      - name: evaplan_api_avance_x_subprograma_raw_data
        description: Datos raw de avance por subprograma obtenidos de la API de Evaplan
      - name: evaplan_api_avance_general_raw_data
        description: Datos raw de avance general obtenidos de la API de Evaplan
      - name: evaplan_api_avance_subprogramas_raw_data
        description: Datos raw de avance de subprogramas obtenidos de la API de Evaplan
      - name: evaplan_api_avance_programas_raw_data
        description: Datos raw de avance de programas obtenidos de la API de Evaplan
      - name: evaplan_api_sector_mp_raw_data
        description: Datos raw del endpoint SectorMP obtenidos de la API de Evaplan
  - name: bronze_ipm_sisben
    description: Fuentes de datos raw del SISBEN en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: ipm_sisben_raw
        description: Datos raw del SISBEN con información de hogares y personas
  - name: bronze_idi
    description: Fuentes de datos raw del Índice de Desarrollo e Innovación (IDI) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: idi_raw_data_territorio_2023
        description: Datos raw del IDI por territorio para el año 2023
      - name: idi_raw_data_territorio_2024
        description: Datos raw del IDI por territorio para el año 2024
  - name: silver_evaplan
    description: Fuentes de datos transformados de Evaplan en la capa silver
    schema: "{{ var('silver_dataset') }}"
    tables:
      - name: evaplan_api_periodos_transformed_data
        description: Datos transformados de periodos de Evaplan
      - name: evaplan_api_avance_mr_transformed_data
        description: Datos transformados de avance de Metas de Resultado (MR) de Evaplan
      - name: evaplan_api_avance_mp_transformed_data
        description: Datos transformados de avance de Metas de Producto (MP) de Evaplan
      - name: evaplan_api_avance_x_subprograma_transformed_data
        description: Datos transformados de avance por subprograma de Evaplan
      - name: evaplan_api_avance_general_transformed_data
        description: Datos transformados de avance general de Evaplan
      - name: evaplan_api_avance_subprogramas_transformed_data
        description: Datos transformados de avance de subprogramas de Evaplan
      - name: evaplan_api_avance_programas_transformed_data
        description: Datos transformados de avance de programas de Evaplan
      - name: evaplan_api_sector_mp_transformed_data
        description: Datos transformados del endpoint SectorMP de Evaplan
  - name: silver_ipm_sisben
    description: Fuentes de datos transformados del SISBEN en la capa silver
    schema: "{{ var('silver_dataset') }}"
    tables:
      - name: ipm_sisben_transformed_data
        description: Datos transformados del SISBEN con información de hogares, servicios, gastos, salud, educación e ingresos
  - name: gold_idc
    description: Fuentes de datos procesados del IDC en la capa gold
    schema: "{{ var('gold_dataset') }}"
    tables:
      - name: DIM_IDC
        description: |
          Tabla dimensional del IDC (Índice de Desarrollo Competitivo) que contiene la estructura jerárquica y descriptiva
          de los indicadores. Esta tabla proporciona información sobre factores, pilares, indicadores y subindicadores,
          permitiendo enriquecer los datos de valores del IDC con nombres descriptivos y la organización jerárquica.
          Se utiliza en el modelo idc_processed_data para hacer JOIN y obtener la información dimensional completa.
        columns:
          - name: ID_FACTOR
            description: "Identificador numérico del factor. Los factores son el nivel más alto de la jerarquía del IDC y agrupan pilares relacionados"
            data_type: INT64
          - name: ID_PILAR
            description: "Identificador numérico del pilar. Los pilares pertenecen a un factor y agrupan indicadores relacionados"
            data_type: INT64
          - name: ID_INDICADOR
            description: "Identificador alfanumérico del indicador principal (ej: INS, INF, TIC, AMB, SAL, EDU, EDS, NEG, LAB, FIN, TAM, SOF, INN). Los indicadores pertenecen a un pilar y agrupan subindicadores"
            data_type: STRING
          - name: ID_SUBINDICADOR
            description: "Identificador alfanumérico del subindicador específico (ej: INS_1_1, INF_1_2, TIC_1_3, etc.). Este es el nivel más granular del IDC y se usa como clave para hacer JOIN con las tablas de valores"
            data_type: STRING
          - name: NOM_FACTOR
            description: "Nombre descriptivo del factor. Proporciona el nombre completo del factor al que pertenece el indicador"
            data_type: STRING
          - name: NOM_PILAR
            description: "Nombre descriptivo del pilar. Proporciona el nombre completo del pilar al que pertenece el indicador"
            data_type: STRING
          - name: NOM_INDICADOR
            description: "Nombre descriptivo del indicador principal. Proporciona el nombre completo del indicador (ej: Instituciones, Infraestructura, TIC, Ambiente, Salud, Educación, etc.)"
            data_type: STRING
          - name: NOM_SUBINDICADOR
            description: "Nombre descriptivo del subindicador específico. Proporciona el nombre completo y detallado del subindicador, que es el nivel más granular de descripción en el IDC"
            data_type: STRING
  - name: gold_evaplan
    description: Fuentes de datos procesados de Evaplan en la capa gold
    schema: "{{ var('gold_dataset') }}"
    tables:
      - name: evaplan_api_avance_mr_processed_data
        description: Datos procesados de avance de Metas de Resultado (MR) enriquecidos con información de periodos
      - name: evaplan_api_avance_mp_processed_data
        description: Datos procesados de avance de Metas de Producto (MP) enriquecidos con información de periodos
      - name: evaplan_api_avance_x_subprograma_processed_data
        description: Datos procesados de avance por subprograma enriquecidos con información de periodos
      - name: evaplan_api_avance_general_processed_data
        description: Datos procesados de avance general enriquecidos con información de periodos
      - name: evaplan_api_avance_subprogramas_processed_data
        description: Datos procesados de avance de subprogramas enriquecidos con información de periodos
      - name: evaplan_api_avance_programas_processed_data
        description: Datos procesados de avance de programas enriquecidos con información de periodos
      - name: evaplan_api_sector_mp_processed_data
        description: Datos procesados del endpoint SectorMP enriquecidos con información de periodos