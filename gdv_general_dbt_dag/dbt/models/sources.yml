      - name: idc_raw_data_valor_normalizado
        description: |
          "Tabla que contiene datos raw (sin transformar) con valores normalizados del Índice de Desarrollo y Competitividad (IDC) por departamento. 
          Estos datos representan los valores originales normalizados tal como se obtienen de la fuente, antes de cualquier transformación adicional. 
          Incluye todos los indicadores IDC organizados por categorías con sus valores normalizados, además de agregados por subcategorías y categorías principales, 
          y el puntaje general del IDC. Las dimensiones incluyen: Insuficiencia de Condiciones de Vida (INS), Insuficiencia de Funcionamiento (INF), 
          Tecnologías de la Información y Comunicación (TIC), Ambiente (AMB), Salud (SAL), Educación (EDU), Edificaciones y Servicios (EDS), 
          Negocios (NEG), Laboral (LAB), Financiero (FIN), Tamaño (TAM), Software (SOF) e Innovación (INN)."
