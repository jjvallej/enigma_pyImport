version: 2
sources:
  - name: bronze_ipmv2
    description: Fuentes de datos raw del Índice de Pobreza Multidimensional (IPM) en la capa bronze
    schema: "{{ var('bronze_dataset') }}"
    tables:
      - name: ipm_raw_data
        description: |
          "Tabla que contiene datos raw (sin transformar) del Índice de Pobreza Multidimensional (IPM) por municipio. 
          Estos datos representan los valores originales tal como se obtienen de la fuente, antes de cualquier transformación o normalización. 
          El IPM mide la pobreza multidimensional considerando 15 indicadores de privación en diferentes dimensiones del bienestar, 
          incluyendo condiciones educativas del hogar, condiciones de la niñez y juventud, trabajo, salud, acceso a servicios públicos domiciliarios, 
          y condiciones de la vivienda. Para cada indicador se registran valores absolutos y porcentajes de personas con privación y sin privación."
