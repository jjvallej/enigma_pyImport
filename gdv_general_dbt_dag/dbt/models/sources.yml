          - name: Fila
            description: "Identificador de fila o número de registro. Campo auxiliar para identificar cada registro en la tabla."
            data_type: STRING
          - name: cod_mpio
            description: "Código del municipio según la codificación oficial. Identifica de manera única cada municipio en el sistema."
            data_type: STRING
          - name: Municipio
            description: "Nombre del municipio. Contiene el nombre completo del municipio evaluado."
            data_type: STRING
          - name: Total
            description: "Total de personas en el municipio. Representa la población total del municipio para el cálculo del IPM."
            data_type: STRING
          - name: IPM_Pobre_Abs
            description: "Índice de Pobreza Multidimensional - Pobres (Absoluto). Número absoluto de personas clasificadas como pobres multidimensionales en el municipio."
            data_type: STRING
          - name: IPM_No_Pobre_Abs
            description: "Índice de Pobreza Multidimensional - No Pobres (Absoluto). Número absoluto de personas clasificadas como no pobres multidimensionales en el municipio."
            data_type: STRING
          - name: IPM_Pobre_Porc
            description: "Índice de Pobreza Multidimensional - Pobres (Porcentaje). Porcentaje de personas clasificadas como pobres multidimensionales en el municipio."
            data_type: STRING
          - name: IPM_No_Pobre_Porc
            description: "Índice de Pobreza Multidimensional - No Pobres (Porcentaje). Porcentaje de personas clasificadas como no pobres multidimensionales en el municipio."
            data_type: STRING
          - name: I1_Con_Privacion_Abs
            description: "Indicador 1 - Con Privación (Absoluto). Número absoluto de personas con privación en el indicador 1 (Analfabetismo)."
            data_type: STRING
          - name: I1_Sin_Privacion_Abs
            description: "Indicador 1 - Sin Privación (Absoluto). Número absoluto de personas sin privación en el indicador 1 (Analfabetismo)."
            data_type: STRING
          - name: I1_Con_Privacion_Porc
            description: "Indicador 1 - Con Privación (Porcentaje). Porcentaje de personas con privación en el indicador 1 (Analfabetismo)."
            data_type: STRING
          - name: I1_Sin_Privacion_Porc
            description: "Indicador 1 - Sin Privación (Porcentaje). Porcentaje de personas sin privación en el indicador 1 (Analfabetismo)."
            data_type: STRING
          - name: I2_Con_Privacion_Abs
            description: "Indicador 2 - Con Privación (Absoluto). Número absoluto de personas con privación en el indicador 2 (Bajo logro educativo)."
            data_type: STRING
