      - name: idi_raw_data_territorio_2024
        description: |
          "Tabla que contiene datos raw (sin transformar) del Índice de Desempeño Institucional (IDI) por territorio para el año 2024. 
          Estos datos representan los valores originales tal como se obtienen de la fuente, antes de cualquier transformación o normalización. 
          El IDI mide el desempeño institucional de las entidades públicas a través de múltiples políticas y dimensiones, incluyendo gestión del talento humano, 
          integridad, planeación institucional, gobierno digital, servicio al ciudadano, participación ciudadana, transparencia, gestión documental, 
          gestión de la información estadística, gestión del conocimiento y control interno. Esta versión del 2024 incluye actualizaciones en la estructura de datos."
        columns:
          - name: Fila
            description: "Identificador de fila o número de registro. Campo auxiliar para identificar cada registro en la tabla."
            data_type: STRING
          - name: codigo_sigep
            description: "Código SIGEP (Sistema de Información para la Gestión Pública) de la entidad. Identifica de manera única cada entidad según el sistema SIGEP."
            data_type: STRING
          - name: entidad
            description: "Nombre de la entidad pública. Contiene el nombre completo de la entidad evaluada."
            data_type: STRING
          - name: orden
            description: "Orden de clasificación o ranking de la entidad. Indica la posición de la entidad en el ranking del IDI."
            data_type: STRING
          - name: clasificacion_organica
            description: "Clasificación orgánica de la entidad. Categoriza la entidad según su estructura organizacional."
            data_type: STRING
          - name: naturaleza_juridica
            description: "Naturaleza jurídica de la entidad. Indica el tipo jurídico de la entidad (pública, privada, mixta, etc.)."
            data_type: STRING
          - name: sector
            description: "Sector al que pertenece la entidad. Identifica el sector económico o administrativo de la entidad."
            data_type: STRING
          - name: departamento
            description: "Nombre del departamento donde se ubica la entidad. Identifica la ubicación geográfica departamental."
            data_type: STRING
          - name: municipio
            description: "Nombre del municipio donde se ubica la entidad. Identifica la ubicación geográfica municipal."
            data_type: STRING
          - name: pdet
            description: "Indicador de si la entidad está en un territorio PDET (Programas de Desarrollo con Enfoque Territorial). Identifica si pertenece a zonas de desarrollo especial."
            data_type: STRING
          - name: capital
            description: "Indicador de si la entidad está ubicada en la capital del departamento. Identifica si es capital departamental."
            data_type: STRING
          - name: grupo_par
            description: "Nombre del grupo PAR (Paz, Acción y Reconciliación). Contiene el nombre descriptivo del grupo PAR al que pertenece la entidad."
            data_type: STRING
          - name: tipo_formulario
            description: "Tipo de formulario utilizado para la evaluación. Indica el tipo o versión del formulario de evaluación aplicado."
            data_type: STRING
          - name: indice_de_desempeno_institucional
            description: "Índice de Desempeño Institucional (IDI) general. Representa el puntaje total agregado del desempeño institucional de la entidad."
            data_type: STRING
