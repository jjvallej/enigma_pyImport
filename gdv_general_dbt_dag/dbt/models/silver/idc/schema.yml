      Este modelo procesa todos los indicadores IDC organizados por categorías: Insuficiencia de Condiciones de Vida (INS), 
      Insuficiencia de Funcionamiento (INF), Tecnologías de la Información y Comunicación (TIC), Ambiente (AMB), Salud (SAL), 
      Educación (EDU), Edificaciones y Servicios (EDS), Negocios (NEG), Laboral (LAB), Financiero (FIN), Tamaño (TAM), 
