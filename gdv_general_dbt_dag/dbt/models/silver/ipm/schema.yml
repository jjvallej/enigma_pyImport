  - name: ipm_transform_transform_types
    description: "Modelo intermedio encargado de la tipificación de datos (Data Typing) en el pipeline de transformación del IPM. Este modelo realiza la conversión de tipos de datos asegurando que las métricas absolutas se conviertan a enteros (INT64) y que los porcentajes se conviertan a números de punto flotante (FLOAT64) con redondeo a 2 decimales para mantener precisión en los cálculos. Utiliza SAFE_CAST para manejar de forma segura strings que no son numéricos, convirtiéndolos en NULL para su posterior limpieza en etapas siguientes del pipeline. Este paso es fundamental para garantizar la calidad y consistencia de los datos antes de aplicar validaciones y generar la tabla final de IPM por municipio."
    columns:
      - name: cod_mpio
        description: "Código DANE del municipio (String)."
      - name: municipio
        description: "Nombre del municipio (Texto normalizado)."
      - name: total
        description: "Población total convertida a entero."
      
      # Métricas Generales IPM
      - name: ipm_pobre_abs
        description: "Valor absoluto de personas en situación de pobreza (INT64)."
      - name: ipm_pobre_porc
        description: "Porcentaje de pobreza redondeado a 2 decimales (FLOAT64)."
      - name: ipm_no_pobre_abs
        description: "Valor absoluto de personas no pobres (INT64)."
      - name: ipm_no_pobre_porc
        description: "Porcentaje de personas no pobres redondeado a 2 decimales (FLOAT64)."

