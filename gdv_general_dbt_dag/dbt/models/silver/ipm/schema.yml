  - name: ipm_transform_clean
    description: "Tabla maestra final del Índice de Pobreza Multidimensional (IPM) por municipio en la capa silver. Esta tabla se materializa como una tabla física en BigQuery con el alias 'ipm_transformed_data' y contiene los datos agregados y validados del IPM. El modelo procesa datos que han pasado por las etapas de staging, tipificación de tipos, limpieza de números, normalización de texto, detección de negativos y validaciones finales. La transformación final convierte la columna fecha_lectura de TIMESTAMP a DATE para facilitar el análisis temporal. La tabla incluye métricas generales de pobreza multidimensional (absolutas y porcentajes) así como los 15 indicadores específicos de privación (I1 a I15) con sus respectivos conteos absolutos y porcentajes de personas con y sin privación. Esta tabla es la fuente principal para reportes ejecutivos, tableros de control, análisis de políticas públicas y toma de decisiones relacionadas con la reducción de la pobreza multidimensional a nivel municipal."
    columns:
      - name: cod_mpio
        description: "Código DANE del municipio (Primary Key lógica)."
        tests:
          - not_null
          - unique
      - name: municipio
        description: "Nombre normalizado del municipio."
        tests:
          - not_null
      - name: total
        description: "Población total del municipio validada."
        tests:
          - not_null

      # Métricas Generales IPM
      - name: ipm_pobre_abs
        description: "Cantidad total de personas en situación de pobreza multidimensional."
      - name: ipm_pobre_porc
        description: "Incidencia de la pobreza multidimensional (H)."
      - name: ipm_no_pobre_abs
        description: "Cantidad total de personas no pobres."
      - name: ipm_no_pobre_porc
        description: "Porcentaje de personas no pobres."

      # --- INDICADORES DE PRIVACIÓN (I1 - I15) ---
