version: 2

models:
  - name: ipm_sisben_stg
    description: "Modelo de staging que enriquece los datos del SISBEN agregando columnas de descripción legible para todos los códigos numéricos de la encuesta. Utiliza la nomenclatura prefijada original de BigQuery y mantiene todas las columnas originales junto con sus respectivas columnas de descripción en texto legible. Este modelo transforma códigos numéricos como tipos de vivienda, materiales de construcción, servicios públicos, discapacidades, niveles educativos, tipos de empleo e indicadores de ingresos en descripciones comprensibles. También incluye los indicadores de pobreza multidimensional (IPM) con sus descripciones correspondientes. El modelo se materializa como una vista en BigQuery con el alias 'ipm_sisben_transformed_data' y sirve como base para análisis detallados de condiciones de vida, acceso a servicios y situación socioeconómica de los hogares encuestados."
