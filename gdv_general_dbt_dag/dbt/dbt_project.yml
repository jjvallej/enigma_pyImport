name: 'gdv_general_dbt_dag'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'gdv_general_dbt_dag'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# External tables configuration removed - not valid in dbt_project.yml

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Variables para configuración portátil
# NOTA: Estas variables se configuran automáticamente desde config.yaml mediante variables de entorno
# que se exportan en los DAGs antes de ejecutar dbt. Los valores por defecto aquí son solo para desarrollo local.
vars:
  project_id: "{{ env_var('DBT_PROJECT_ID', 'datagov-473122') }}"
  bronze_dataset: "{{ env_var('DBT_DATASET_BRONZE', 'bronze_dpt_planeacion_municipal_dev') }}"
  silver_dataset: "{{ env_var('DBT_DATASET_SILVER', 'silver_dpt_planeacion_municipal_dev') }}"
  gold_dataset: "{{ env_var('DBT_DATASET_GOLD', 'gold_dpt_planeacion_municipal_dev') }}"

# Configuring models
models:
  gdv_general_dbt_dag:
    silver:
      +materialized: view
      +database: "{{ var('project_id') }}"
      +schema: "{{ var('silver_dataset') }}"
    gold:
      +materialized: table
      +database: "{{ var('project_id') }}"
      +schema: "{{ var('gold_dataset') }}"
