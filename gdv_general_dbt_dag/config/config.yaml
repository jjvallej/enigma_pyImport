ipm_sisben:
  drive_url: "https://docs.google.com/spreadsheets/d/1tUZvT4fC2PmeQrvTUHdUvjN8j3fdD53k/edit?usp=sharing&ouid=114741032353429683392&rtpof=true&sd=true"
  gcs_folder: "data_staging/dpt_planeacion_municipal/ipm/sisben"
  gcs_temp_folder: "data_staging/dpt_planeacion_municipal/tmp_sisben"
  table_name: "ipm_sisben_raw"
