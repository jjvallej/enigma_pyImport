  csv_files:
    - "hoja1_ipm_sisben.csv"
    - "hoja2_ipm_sisben.csv"
    - "hoja3_ipm_sisben.csv"
  external_table:
    gcs_path: "data_staging/dpt_planeacion_municipal/ipm/sisben/*.csv"  # Ruta en GCS con wildcard para todos los CSVs
