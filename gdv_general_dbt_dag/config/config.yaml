global_config:
  debug: true

environments:
  dev:
    bucket_name: "datalake_gdv_dev"
    dataset_bronze: "bronze_dpt_planeacion_municipal_dev"
    dataset_silver: "silver_dpt_planeacion_municipal_dev"
    dataset_gold: "gold_dpt_planeacion_municipal_dev"
  prod:
    bucket_name: "datalake_gdv_prod"
    dataset_bronze: "bronze_dpt_planeacion_municipal_prod"
    dataset_silver: "silver_dpt_planeacion_municipal_prod"
    dataset_gold: "gold_dpt_planeacion_municipal_prod"
  local:
    bucket_name: "datalake_gdv_dev"
    dataset_bronze: "bronze_dpt_planeacion_municipal_dev"
    dataset_silver: "silver_dpt_planeacion_municipal_dev"
    dataset_gold: "gold_dpt_planeacion_municipal_dev"

evaplan:
  auth_endpoint: "https://api.evaplan.com/auth/login"
  api_base_url: "https://api.evaplan.com/v1"
  endpoints:
    periodos: "/periodos"
    avance_mr: "/avance-mr"
    avance_mp: "/avance-mp"
    avance_x_subprograma: "/avance-x-subprograma"
    avance_general: "/avance-general"
  gcs_folder: "data_staging/dpt_planeacion_municipal/api_evaplan/periodos"
  fuentes:
    - "periodos"
    - "avance_mr"
    - "avance_mp"
    - "avance_x_subprograma"
    - "avance_general"

idc:
  drive_url: "https://docs.google.com/spreadsheets/d/1J42xKC3VnkjhwHQENKxo2DDQzuBINYxY/edit?usp=drive_link&ouid=109263228047844968910&rtpof=true&sd=true"
  gcs_folder: "data_staging/dpt_planeacion_municipal/idc"
  tables:
    dictionary: "dim_idc"
    raw_data_mapping:
      Dato_original: "idc_raw_data_dato_original"
      Valor_normalizado: "idc_raw_data_valor_normalizado"
      Valor_ranking: "idc_raw_data_valor_ranking"

ipm:
  drive_url: "https://docs.google.com/spreadsheets/d/1uXHTK64SVXmsV-nKGXT8Vz7u_b4gXvYs/edit?usp=drive_link&ouid=109263228047844968910&rtpof=true&sd=true"
  gcs_folder: "data_staging/dpt_planeacion_municipal/ipm"
  tables:
    bronze: "ipm_raw_data"
    silver: "ipm_transformed_data"
    gold: "ipm_processed_data"

