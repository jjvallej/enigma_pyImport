evaplan:
  auth_endpoint: http://207.246.89.62/ApiEvaplan/auth/login
  api_base_url: http://207.246.89.62/ApiEvaplan
  endpoints:
    periodos: /datos/periodos
    avance_mr: /datos/AvanceMR
    avance_mp: /datos/AvanceMP
    avance_x_subprograma: /datos/AvanceXSubprograma
    avance_general: /datos/AvanceGeneral
    avance_subprogramas: /datos/AvanceSubprogramas
    avance_programas: /datos/AvanceProgramas
    sector_mp: /datos/SectorMP
  gcs_base_folder: data_staging/dpt_planeacion_municipal/api_evaplan
  gcs_folders:
    periodos: periodos
    avance_mr: avance_mr
    avance_mp: avance_mp
    avance_x_subprograma: avance_x_subprograma
    avance_general: avance_general
    avance_subprogramas: avance_subprogramas
    avance_programas: avance_programas
    sector_mp: sector_mp
  fuentes:
  - periodos
  - avance_mr
  - avance_mp
  - avance_x_subprograma
  - avance_general
  - avance_subprogramas
  - avance_programas
  - sector_mp
  tables:
    bronze:
      periodos: evaplan_api_periodos_raw_data
      avance_mr: evaplan_api_avance_mr_raw_data
      avance_mp: evaplan_api_avance_mp_raw_data
      avance_x_subprograma: evaplan_api_avance_x_subprograma_raw_data
      avance_general: evaplan_api_avance_general_raw_data
      avance_subprogramas: evaplan_api_avance_subprogramas_raw_data
      avance_programas: evaplan_api_avance_programas_raw_data
      sector_mp: evaplan_api_sector_mp_raw_data
    silver:
      periodos: evaplan_api_periodos_transformed_data
      avance_mr: evaplan_api_avance_mr_transformed_data
      avance_mp: evaplan_api_avance_mp_transformed_data
      avance_x_subprograma: evaplan_api_avance_x_subprograma_transformed_data
      avance_general: evaplan_api_avance_general_transformed_data
      avance_subprogramas: evaplan_api_avance_subprogramas_transformed_data
      avance_programas: evaplan_api_avance_programas_transformed_data
      sector_mp: evaplan_api_sector_mp_transformed_data
    gold:
      avance_mr: evaplan_api_avance_mr_processed_data
      avance_mp: evaplan_api_avance_mp_processed_data
      avance_x_subprograma: evaplan_api_avance_x_subprograma_processed_data
      avance_general: evaplan_api_avance_general_processed_data
      avance_subprogramas: evaplan_api_avance_subprogramas_processed_data
      avance_programas: evaplan_api_avance_programas_processed_data
      sector_mp: evaplan_api_sector_mp_processed_data
    gold_facts:
      fact_entidad: FACT_ENTIDAD
      fact_programa: FACT_PROGRAMA
      fact_resumen: FACT_RESUMEN
      fact_sector: FACT_SECTOR
  credentials:
    usuario: usuario_api
    password: ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f
