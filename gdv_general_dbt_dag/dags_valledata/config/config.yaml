      # Ejemplo:
      # - conn_id: ckan_pg_01
      #   municipio: alcala
      ckan_comentarios: []
    bigquery:
      project_id: "datagov-477214"
      location: "US"
      datasets:
        bronze: "valledata"
        silver: "valledata"
      buckets:
        bronze: "gs://valledata-bronze-qa"
        silver: "gs://valledata-silver-qa"
      tables:
