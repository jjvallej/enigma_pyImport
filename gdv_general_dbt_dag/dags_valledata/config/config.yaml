# ==============================================================================
# ARCHIVO DE CONFIGURACIÓN DE PIPELINE MULTIENTORNO (pyimport / airflow)
# Ubicación: src/pyimport/config/config.yaml
# ==============================================================================

# Entorno Activo Predeterminado: "dev", "qa", o "prod"
active_environment: "dev"

# Configuración Específica por Entorno
environments:
  dev:
    gcs_bucket: "gs://datalake_gdv_pdn/data_staging/valledata"
    local_raw_path: "data/raw"
    local_output_path: "data"
    composer:
      environment: "composer-gdv"
      location: "us-east1"
      project: "datagov-477214"
    connections:
      sipsa_dane: "sipsa_dane"
      noaa_oni: "noaa_oni"
      gobernacion_valle: "gobernacion_valle"
      datos_gov_co: "datos_gov_co"
      google_cloud_default: "google_cloud_default"
      # Arreglo de conexiones Postgres a instancias CKAN (hasta 14).
      # Cada ítem es una conexión Airflow tipo postgres (host/ruta distinta).
      # Ejemplo:
      # - conn_id: ckan_pg_01
      #   municipio: alcala
      ckan_comentarios: []
    bigquery:
      project_id: "datagov-477214"
      location: "US"
      datasets:
        bronze: "valledata"
        silver: "valledata"
      buckets:
        bronze: "gs://valledata-bronze-dev"
        silver: "gs://valledata-silver-dev"
      tables:
        sipsa_bronze: "bronze_agri_sipsa"
        oni_bronze: "bronze_oni_climatico"
        cultivos_bronze: "bronze_cultivos_valle"
        municipios_bronze: "bronze_municipios_valle"
        consolidado_silver: "silver_agri_consolidado"
        gold_spatial: "gold_cultivos_valle_geo"
        comentarios_bronze: "bronze_comentarios"
        comentarios_silver: "silver_comentarios"
        comentarios_gold: "gold_comentarios_sentimiento"
        gold_comentarios_sentimiento: "gold_comentarios_sentimiento"

