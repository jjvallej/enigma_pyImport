[project]
name = "gdv-datastack-template"
version = "0.1.0"
description = "Plantilla local para Astro/Airflow + dbt + Cosmos"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Alejandro Valencia", email = "avalencia@enigmadev.com" }
]

# Dependencias principales
dependencies = [
  "apache-airflow==2.10.5",
  "astronomer-cosmos==1.9.0",
  "dbt-core==1.9.0",
  "dbt-bigquery==1.9.0",
  "hydra-core==1.3.2",
  "numpy==1.26.4",
  "google-cloud-bigquery[pandas,pyarrow]",
  "google-cloud-storage",
  "google-cloud-core",
  "google-auth",
  "google-auth-oauthlib",
  "google-auth-httplib2",
  "requests>=2.31.0"
]

[project.optional-dependencies]
# Dev tools opcionales (instálalos con: poetry install --with dev)
dev = [
  "ruff>=0.4.0",
  "sqlfluff>=2.0.0",
  "sqlfluff-templater-dbt>=2.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Puedes conservar tu configuración de ruff tal cual:
[tool.ruff]
exclude = [
  ".bzr",".direnv",".eggs",".git",".git-rewrite",".hg",".ipynb_checkpoints",
  ".mypy_cache",".nox",".pants.d",".pyenv",".pytest_cache",".pytype",".ruff_cache",
  ".svn",".tox",".venv",".vscode","__pypackages__","_build","buck-out","build",
  "dist","node_modules","site-packages","venv"
]
line-length = 140
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4","E7","E9","F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
